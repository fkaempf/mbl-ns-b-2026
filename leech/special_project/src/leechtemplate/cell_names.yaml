# Controlled vocabulary of crawling-relevant identified cells (first pass).
# This is a SEED list. The annotation tool offers these names but allows free-text
# names, flagging anything not listed here. Per-cell COUNTS are intentionally not
# encoded: many of these have multiple subtypes per side (e.g. P, N, T) — click and
# label whatever the figure actually shows. Expand this list to reach the full
# mapped set later without code changes.
#
# Fields per entry are advisory metadata for the annotator, not constraints:
#   typical_aspect: where the soma is usually drawn (ventral/dorsal/either)
#   note: short reminder of the cell's role
cells:
  - name: Retzius
    typical_aspect: ventral
    note: "large serotonergic neuromodulatory pair, near midline"
  - name: P
    typical_aspect: ventral
    note: "pressure mechanosensory (multiple subtypes per side, e.g. Pd/Pv)"
  - name: N
    typical_aspect: ventral
    note: "nociceptive mechanosensory (e.g. Nl/Nm per side)"
  - name: T
    typical_aspect: ventral
    note: "touch mechanosensory (multiple per side)"
  - name: AE
    typical_aspect: ventral
    note: "annulus erector motor neuron"
  - name: CV
    typical_aspect: ventral
    note: "crawling-related interneuron"
  - name: DE-3
    typical_aspect: dorsal
    note: "dorsal excitor motor neuron 3"
  - name: NS/151
    typical_aspect: ventral
    note: "interneuron implicated in crawling (cell 151 / NS)"
