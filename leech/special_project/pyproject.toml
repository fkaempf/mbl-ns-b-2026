[project]
name = "leech-special-project"
version = "0.1.0"
description = "Leech behavioral annotation/arena tools and calcium-imaging analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "imageio>=2.31",
    "napari[all]>=0.4.19",
    "magicgui>=0.8",
    "opencv-python-headless>=4.8",
    "imageio-ffmpeg>=0.4",
    "suite2p[gui]",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# deep-learning keypoint scripts (scripts/dl_*.py); install with: uv sync --extra dl
dl = ["torch>=2.2", "torchvision>=0.17", "tqdm>=4.0"]

[project.scripts]
leech-arena = "leecharena.app:main"
leech-arena-annotate = "leecharena.annotate:main"
leech-arena-place = "leecharena.place:main"
leech-arena-split = "leecharena.split:main"
leech-arena-compress = "leecharena.compress:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leecharena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
suite2p = { git = "https://github.com/Mouseland/suite2p" }
